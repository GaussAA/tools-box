name: CI

# 干净机器上的完整回归：四个不依赖构建的快检 → 配置 → Debug/Release 双配置构建 →
# ctest → 打包。清单与依据见 docs/workflow.md，本地怎么跑同一套见 §9。
#
# 有意**不做**的事：界面与真实下载链路（verify_shell.ps1 等）不进 CI。它们要靠
# UI 自动化驱动真实窗口与真实网络，属于手工回归，不是单元测试的替代品 —— 这条
# 分工写在 docs/workflow.md §5。
#
# 维护提醒：这些 Action 保持在大版本号的最新档。第一次跑就收到
# 「Node.js 20 is deprecated」的告警 —— Action 自带运行时会被 GitHub 淘汰，
# 钉在旧大版本上迟早会红。升级前先确认 inputs 没改名（用 gh api 读它的
# action.yml，比猜可靠）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推几次时，把还在跑的旧任务取消，省额度也省等待。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / test / package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── 快检先跑：它们只需几秒，失败得最快，能省掉后面几分钟的构建 ──

      # 显式调用 Windows PowerShell 5.1（而不是默认的 pwsh 7）：
      # 这些脚本就是按 5.1 的脾气写的（.ps1 的 BOM 约定、ANSI 代码页的坑），
      # 用较老的那个解析器来验，覆盖更严。
      - name: Whitespace and encoding
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_whitespace.ps1

      # 格式检查依赖格式化器版本，output 会随版本变。用 PyPI 的 wheel 装一个钉死的
      # 版本，而不是用 runner 上 VS 自带那个（版本随镜像滚动，检查会变成不确定）。
      # 版本号必须与 scripts/verify/verify_format.ps1 里的 $expectedVersion 一致。
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pinned clang-format
        run: python -m pip install clang-format==22.1.3

      - name: Formatting
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_format.ps1

      - name: Coding conventions
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_conventions.ps1

      - name: Docs consistency
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_docs.ps1

      # ── 构建 ──

      # 官方源，**不要**开 mirror。本项目吃过镜像的亏：清华源的 Qt 包已损坏会报
      # ArchiveChecksumError，华为云/阿里云镜像定位不到 XML。这条踩坑记录在
      # docs/workflow.md §1，别在 CI 里重新踩一遍。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          cache: true

      # Ninja 需要 cl.exe 在 PATH 上。GitHub 的每个 run 步骤是独立 shell，所以
      # 环境变量得靠这个 action 写进 GITHUB_ENV 才能跨步骤生效。
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 出错时先看这里：确认 Qt 与 MSVC 的位置是否符合预期。
      - name: Show toolchain
        run: |
          Write-Output "QT_ROOT_DIR   = $env:QT_ROOT_DIR"
          Write-Output "Qt6_DIR       = $env:Qt6_DIR"
          Write-Output "VCToolsVersion= $env:VCToolsVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source
          cmake --version | Select-Object -First 1

      # 复用 CMakePresets.json 这一个构建入口，不在这里重复一份配置。
      # 命令行 -D 会覆盖 preset 的 cacheVariables（已实测），所以 Qt 路径按 runner
      # 的实际情况传入，preset 里那份本机绝对路径不必改动。
      - name: Configure
        run: cmake --preset default -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Debug
        run: cmake --build --preset debug

      - name: Build Release
        run: cmake --build --preset release

      # /W4 /permissive- /WX 已开，告警即错误，所以「构建通过」本身就等于 0 告警。
      - name: Unit tests
        run: ctest --test-dir build -C Debug --output-on-failure

      # ── 打包：顺带验证发布链路在干净机器上也能走通 ──

      - name: Deploy Qt runtime
        run: cmake --build build --config Release --target deploy

      - name: Package
        run: cpack --config build\CPackConfig.cmake -C Release -B build\package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ToolBox-${{ github.sha }}-win64
          path: build/package/*.zip
          if-no-files-found: error
          retention-days: 14
