name: CI

# 干净机器上的完整回归：四个不依赖构建的快检 → 配置 → Debug/Release 双配置构建 →
# 双配置 ctest → 命名检查（要 compile_commands.json，所以排在构建之后）→ 打包。
# 清单与依据见 docs/workflow.md，本地怎么跑同一套见 §9。
#
# 有意**不做**的事：界面与真实下载链路（verify_shell.ps1 等）不进 CI。它们要靠
# UI 自动化驱动真实窗口与真实网络，属于手工回归，不是单元测试的替代品 —— 这条
# 分工写在 docs/workflow.md §5。
#
# 维护提醒：这些 Action 保持在大版本号的最新档。Action 自带运行时会被 GitHub 淘汰，
# 钉在旧大版本上迟早会红（第一次跑就收到过 Node.js 20 的弃用告警）。升级前先确认
# inputs 没改名（用 gh api 读它的 action.yml，比猜可靠）。
#
# 现在整个 workflow 只剩三个 GitHub 官方 Action（checkout / setup-python /
# upload-artifact），没有第三方 Action —— Qt 由 pip 装的 aqtinstall 直接安装（原因见
# 下面 Install Qt），MSVC 环境由 vswhere + DevShell 模块自己搭（原因见 Set up MSVC）。
# 原先后端还需要 ilammy/msvc-dev-cmd，但它的 action.yml 声明 `using: node20` 且没有
# v2，那条弃用告警只能靠「不用它」来消除。

on:
  push:
    branches: [main]
    # 打 v* 标签同样跑一遍：发布用的产物应当是 CI 从该标签构建出来的，而不是把手边的
    # zip 碰巧发出去。发布流程见 docs/workflow.md §9。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支连推几次时，把还在跑的旧任务取消，省额度也省等待。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / test / package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ── 快检先跑：它们只需几秒，失败得最快，能省掉后面几分钟的构建 ──

      # 显式调用 Windows PowerShell 5.1（而不是默认的 pwsh 7）：
      # 这些脚本就是按 5.1 的脾气写的（.ps1 的 BOM 约定、ANSI 代码页的坑），
      # 用较老的那个解析器来验，覆盖更严。
      - name: Whitespace and encoding
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_whitespace.ps1

      # 两个 clang 工具都依赖版本：格式化器的 output 会随版本变，clang-tidy 的判定也会
      # 随 LLVM 线变。都用 PyPI 的 wheel 装钉死的版本，而不是用 runner 上 VS 自带那个
      # （版本随镜像滚动，检查会变成不确定）。
      #   * clang-format 必须与 verify_format.ps1 的 $expectedVersion 精确一致（22.1.3）；
      #   * clang-tidy 钉的是 22.1 这一条 LLVM 线（本机 VS 自带的 22.1.3 同样可用），
      #     理由写在 verify_naming.ps1 头部。
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pinned clang-format and clang-tidy
        run: python -m pip install clang-format==22.1.3 clang-tidy==22.1.8

      - name: Formatting
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_format.ps1

      - name: Coding conventions
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_conventions.ps1

      # 「单文件超过 600 行必须评估拆分、并记录结论」——不进 CI 的话这条规则等于没写：
      # 没人会在评审里翻这条，文件只会继续长下去。
      - name: Source file size
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_filesize.ps1

      # workflow §5 的「core/ 必须有测试」此前只是文档里的一句话，没有任何东西在查 ——
      # 加一个没有测试的 core 模块，所有检查照样全绿。
      - name: Core modules have tests
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_coretest.ps1

      - name: Docs consistency
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_docs.ps1

      # ── 构建 ──

      # 官方源，**不要**开 mirror。本项目吃过镜像的亏：清华源的 Qt 包已损坏会报
      # ArchiveChecksumError，华为云/阿里云镜像定位不到 XML。这条踩坑记录在
      # docs/workflow.md §1，别在 CI 里重新踩一遍。
      #
      # 为何不直接用 jurplel/install-qt-action：它调用的 aqtinstall 最新发布版
      # （3.3.0）尚不支持 Qt 6.11+ —— 该支持只在其 CHANGELOG 的「Unreleased」段
      # （"Support Qt 6.11+ for Windows X64" #1000），因此装 6.12.0 会报
      # "Failed to locate XML data for Qt version '6.12.0'"。此处直接装 aqtinstall
      # 主干并手动安装；待含该支持的正式版发布后，可改回 install-qt-action。
      #
      # 主干必须**钉死到 commit**（2026-10-02 钉在 076e165，当时的最新提交）：
      # 裸写 git+https://master 意味着上游一次无关合并就能让 CI 在本项目零改动时
      # 突然变红，且失败信息与真实原因隔得很远。升级步骤：
      #   1. gh api repos/miurahr/aqtinstall/commits/master --jq .sha 取新 commit；
      #   2. 换掉下面的 @ 后哈希，跑一次 CI 确认绿；
      #   3. 若 aqtinstall 发布了含 Qt 6.11+ 支持的正式版，整体改回 install-qt-action。
      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade --disable-pip-version-check "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          $qtRoot = "$env:GITHUB_WORKSPACE\Qt\6.12.0\msvc2022_64"
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE\Qt"
          if (-not (Test-Path "$qtRoot\bin\qmake.exe")) { throw "Qt 6.12.0 did not install to $qtRoot" }
          "QT_ROOT_DIR=$qtRoot" | Add-Content -Path $env:GITHUB_ENV
          "$qtRoot\bin"         | Add-Content -Path $env:GITHUB_PATH

      # Ninja 需要 cl.exe 在 PATH 上。GitHub 的每个 run 步骤是独立 shell，所以环境
      # 变量得写进 GITHUB_ENV 才能跨步骤生效。
      #
      # 这里刻意不用第三方 Action（原先用 ilammy/msvc-dev-cmd）：它在 action.yml 里
      # 声明 `using: node20`，且只有 v1.x 没有 v2，于是每次跑都会挂一条 Node 20 弃用
      # 告警。而它做的事就是「跑 vcvars 并把环境变量传给后续步骤」—— 用微软自带的
      # vswhere + DevShell 模块更直接，也少一个第三方依赖。
      #
      # 必须用 pwsh（PowerShell 7）：5.1 的 Out-File/Add-Content -Encoding utf8 会写
      # BOM，写进 GITHUB_ENV 会把文件污染掉。
      - name: Set up MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
          if (-not $vsPath) { throw "no Visual Studio installation with the C++ x64 toolset" }
          Write-Output "Visual Studio = $vsPath"

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }

          Import-Module (Join-Path $vsPath "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
                           -DevCmdArguments "-arch=x64 -host_arch=x64" | Out-Null

          # 只导出「新增或改变」的变量（本机实测 38 个）：全量回写会把 GITHUB_* /
          # RUNNER_* 这些 runner 自己的变量也写回 GITHUB_ENV。
          $lines = New-Object System.Collections.Generic.List[string]
          Get-ChildItem Env: | ForEach-Object {
            $old = if ($before.ContainsKey($_.Name)) { $before[$_.Name] } else { $null }
            if ($old -ne $_.Value) {
              # GITHUB_ENV 是「一行一个 KEY=VALUE」，多行值会直接破坏格式。
              if ($_.Value -match "`r|`n") { throw "env var $($_.Name) is multi-line; GITHUB_ENV cannot carry it" }
              $lines.Add("$($_.Name)=$($_.Value)")
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value $lines
          Write-Output "exported $($lines.Count) variable(s) to GITHUB_ENV"
          Write-Output "cl.exe = $((Get-Command cl.exe).Source)"

      # 出错时先看这里：确认 Qt 与 MSVC 的位置是否符合预期。
      - name: Show toolchain
        run: |
          Write-Output "QT_ROOT_DIR   = $env:QT_ROOT_DIR"
          Write-Output "Qt6_DIR       = $env:Qt6_DIR"
          Write-Output "VCToolsVersion= $env:VCToolsVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source
          cmake --version | Select-Object -First 1

      # 复用 CMakePresets.json 这一个构建入口，不在这里重复一份配置。
      # 命令行 -D 会覆盖 preset 的 cacheVariables（已实测），所以 Qt 路径按 runner
      # 的实际情况传入，preset 里那份本机绝对路径不必改动。
      - name: Configure
        run: cmake --preset default -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Debug
        run: cmake --build --preset debug

      - name: Build Release
        run: cmake --build --preset release

      # /W4 /permissive- /WX 已开，告警即错误，所以「构建通过」本身就等于 0 告警。
      - name: Unit tests (Debug)
        run: ctest --test-dir build -C Debug -j --output-on-failure

      # 两个配置都跑：Release 开优化并定义 NDEBUG，只跑 Debug 会漏掉只在 Release 显形的
      # 缺陷（未初始化读、优化相关行为差异、断言掩盖的逻辑）。
      - name: Unit tests (Release)
        run: ctest --test-dir build -C Release -j --output-on-failure

      # 命名检查需要 build 下的 compile_commands.json 与 AUTOMOC 产物，所以排在构建之后。
      # 它检查的是源码本身，与配置无关，跑一次即可；脚本自己校验工具版本落在 22.1 线上。
      - name: Naming
        run: powershell -ExecutionPolicy Bypass -File scripts\verify\verify_naming.ps1

      # ── 打包：顺带验证发布链路在干净机器上也能走通 ──

      - name: Deploy Qt runtime
        run: cmake --build build --config Release --target deploy

      - name: Package
        run: cpack --config build\CPackConfig.cmake -C Release -B build\package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ToolBox-${{ github.sha }}-win64
          path: build/package/*.zip
          if-no-files-found: error
          retention-days: 14
